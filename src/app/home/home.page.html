<ion-header>
  <ion-toolbar color="primary">
    <ion-title>PELÍCULAS</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list lines="none">
    <!-- Criterio de evaluación: @for -->
    @for (pelicula of listaPeliculas; track pelicula.id) {
      <ion-card class="ion-margin-bottom">
        <ion-item lines="none">
          <ion-label>
            <!-- Criterio de evaluación: Interpolación -->
            <h2><strong>{{ pelicula.titulo }}</strong></h2>
            <p>{{ pelicula.genero }}</p>
            <p>Año: {{ pelicula.anio }}</p>
            <p>Duración: {{ pelicula.duracion }} min</p>
          </ion-label>
        </ion-item>

        <div class="ion-padding-horizontal ion-padding-bottom">
          <!-- Criterios de evaluación: Property Binding [expand] y Event Binding (click) -->
          <ion-button 
            [expand]="'block'" 
            fill="outline" 
            (click)="verDetalle(pelicula.id)">
            Ver detalle
          </ion-button>
        </div>
      </ion-card>
    }
  </ion-list>
</ion-content>
